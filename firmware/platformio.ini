; ============================================================================
;  UVLink - firmware ESP32-S3 mini (carte "C-Board" KD8CEC, RP2040 remplacé)
;
;  Pont Bluetooth LE <-> poste Quansheng UV-K1 / UV-K5 V3 en mode hôte :
;  pilotage série du poste, audio bidirectionnel (ADC GPIO1 / PWM GPIO7),
;  décodeurs embarqués (SARSAT 406, APRS, radiosondes, SSTV) portés depuis
;  Sarsat_UV-K1-5_RP2040. L'appli UVLink (Avalonia .NET, Ubuntu / Windows /
;  Android) fait l'interface. Voir ../README.md et ../docs/.
;
;  Carte : "ESP32-S3 Mini" / "Super Mini" (USB-C natif, pas de puce
;  USB-série) -> console sur l'USB CDC natif (ARDUINO_USB_CDC_ON_BOOT),
;  UART0 (GPIO43/44) libre pour le poste.
; ============================================================================
[env:esp32s3mini]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

; La plupart des "S3 Super Mini" embarquent un ESP32-S3FH4R2 : 4 Mo de flash,
; 2 Mo de PSRAM. Si ta carte a 8/16 Mo, remonte ces valeurs.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; min_spiffs : deux partitions appli de ~1,9 Mo (les décodeurs + esp-dsp ne
; tiennent pas dans les 1,3 Mo de la table par défaut). NVS seulement.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    ; USB natif : Serial = CDC sur le port USB-C (console / flash)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NE PAS toucher à CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT : avec 32 au lieu de 12
    ; la découverte GATT de BlueZ n'aboutit plus (contrôleur précompilé) ;
    ; le débit audio est géré par la file + réessais de AudioStream.
build_unflags =
    -std=gnu++11

lib_ldf_mode = deep+
